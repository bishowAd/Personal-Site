<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bishow Adhikari | Data Scientist & UI Designer</title>
    <meta name="description" content="Bishow Adhikari — Data Scientist, Data Analyst, and UI Designer based in Hammond, LA." />

    <!-- 1. Tailwind config must come before the CDN script -->
    <script>
      window.tailwind = window.tailwind || {};
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans:    ['Inter', 'sans-serif'],
              display: ['Space Grotesk', 'sans-serif'],
            },
          },
        },
      };
    </script>

    <!-- 2. Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 3. Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet" />

    <!-- 4. Custom CSS -->
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body class="font-sans antialiased bg-white text-gray-900">
    <!-- All content is injected here by main.js -->
    <div id="app"></div>

    <!-- 5. App entry point (ES modules — requires a local server, e.g. VSCode Live Server) -->
    <script type="module" src="js/main.js"></script>
  </body>
</html>
